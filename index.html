<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniPill - NanoMedical Interface</title>
    <style>
        :root {
            --bg-color: #0a1128;
            --card-bg: #111a36;
            --primary: #00f0ff;
            --accent: #00ff87;
            --text: #ffffff;
            --text-muted: #8fa0dd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        /* Medical Tech Card Style */
        .panel {
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
            position: relative;
        }

        h2 {
            color: var(--primary);
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-muted);
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        button.btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #0072ff);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button.btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        /* Header Components */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .brand {
            font-weight: bold;
            color: var(--primary);
            font-size: 18px;
        }

        .btn-subscribe {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.3s;
        }

        .btn-subscribe:hover {
            background: var(--accent);
            color: var(--bg-color);
        }

        /* Condition Buttons */
        .condition-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-condition {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 16px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .btn-condition:hover {
            background: rgba(0, 240, 255, 0.08);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .btn-condition::after {
            content: '→';
            color: var(--primary);
        }

        /* Status Screen */
        .status-screen {
            text-align: center;
            padding: 40px 10px;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 240, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            margin: 0 auto 25px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-icon {
            font-size: 50px;
            color: var(--accent);
            margin-bottom: 20px;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .timer {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
            margin-top: 15px;
        }

        /* Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 9, 22, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            position: relative;
        }

        .modal h3 {
            color: var(--accent);
            margin-bottom: 15px;
            font-size: 22px;
        }

        .modal .price {
            font-size: 28px;
            font-weight: bold;
            color: white;
            margin: 15px 0;
        }

        .modal .benefits {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        /* Utility classes to toggle screens */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- SCREEN 1: SIGN UP (Any ID/PW works) -->
        <div id="screen-auth" class="panel">
            <h2>OmniPill System</h2>
            <p class="subtitle">Initialize your NanoChip medical profile</p>
            <form id="auth-form" onsubmit="handleSignUp(event)">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" required placeholder="Enter any ID">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" required placeholder="Enter any password">
                </div>
                <button type="submit" class="btn-primary">Create Bio-Account</button>
            </form>
        </div>

        <!-- SCREEN 2: MAIN DASHBOARD -->
        <div id="screen-dashboard" class="panel hidden">
            <div class="dashboard-header">
                <div class="brand">OmniPill Core</div>
                <button class="btn-subscribe" onclick="toggleModal(true)">Subscribe</button>
            </div>
            
            <p class="subtitle">Select a target condition to reconfigure NanoChips</p>
            
            <div class="condition-list">
                <button class="btn-condition" onclick="triggerNanoChip('Fatigue Recovery & Energy Boost')">Fatigue Recovery</button>
                <button class="btn-condition" onclick="triggerNanoChip('Instant Stress Relief & Calmness')">Stress Relief</button>
                <button class="btn-condition" onclick="triggerNanoChip('Cognitive Enhancement & Focus')">Focus Boost</button>
                <button class="btn-condition" onclick="triggerNanoChip('Deep Sleep & Cellular Repair')">Deep Sleep</button>
                <button class="btn-condition" onclick="triggerNanoChip('Immune System Optimization')">Immune Optimization</button>
            </div>
        </div>

        <!-- SCREEN 3: PROCESSING (30 Seconds) -->
        <div id="screen-processing" class="panel hidden">
            <div class="status-screen">
                <div class="loader"></div>
                <h2>NanoChips Active</h2>
                <p id="target-condition" style="color: var(--primary); font-weight: bold; margin-bottom: 10px;"></p>
                <p class="subtitle">Reconfiguring cellular structure... Please stay still.</p>
                <div id="countdown" class="timer">30s</div>
            </div>
        </div>

        <!-- SCREEN 4: COMPLETED (5 Seconds) -->
        <div id="screen-completed" class="panel hidden">
            <div class="status-screen">
                <div class="success-icon">✓</div>
                <h2>Dispensation Complete</h2>
