<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoMed Lab & SYSTEM</title>
    <style>
        /* Scientific & Medical Palette (Red, Blue, Tech Gray) */
        :root {
            --primary-blue: #0A2540;
            --tech-blue: #00D4B2;
            --medical-red: #FF3B30;
            --neon-blue: #007AFF;
            --bg-light: #F4F6F8;
            --text-dark: #1C1C1E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.6; padding-bottom: 60px; }

        /* Navigation Header */
        header { background-color: #ffffff; border-bottom: 1px solid #E5E5EA; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 800; font-size: 20px; color: var(--primary-blue); letter-spacing: 1px; }
        .logo span { color: var(--medical-red); }
        .nav-links button { background: none; border: none; font-size: 14px; font-weight: 600; color: #666; margin-left: 20px; cursor: pointer; }
        .nav-links button.active { color: var(--medical-red); border-bottom: 2px solid var(--medical-red); padding-bottom: 2px; }

        /* Page Routing Containers */
        .page { display: none; }
        .page.active { display: block; }

        /* --- [PAGE 1: E-COMMERCE STORE] --- */
        .hero { background: radial-gradient(circle at top right, #0F172A, #020617); color: white; padding: 60px 40px; text-align: center; }
        .hero-tag { font-size: 12px; font-weight: 700; color: var(--tech-blue); letter-spacing: 2px; margin-bottom: 15px; display: inline-block; padding: 4px 12px; background: rgba(0, 212, 178, 0.1); border-radius: 20px; text-transform: uppercase; }
        .hero h2 { font-size: 36px; font-weight: 800; margin-bottom: 10px; }
        .hero p { color: #94A3B8; font-size: 15px; max-width: 600px; margin: 0 auto; }

        .main-layout { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .products-section { display: flex; flex-direction: column; gap: 25px; }
        .product-card { background: white; border-radius: 16px; border: 1px solid #E5E5EA; padding: 25px; display: flex; gap: 25px; align-items: center; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        
        /* Interactive Capsule Mockup */
        .capsule-visual { width: 100px; height: 100px; background: #F8FAFC; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; border: 2px dashed #CBD5E1; }
        .capsule { width: 30px; height: 65px; border-radius: 40px; transform: rotate(45deg); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .capsule.red-blue .top { height: 50%; background: var(--medical-red); }
        .capsule.red-blue .bottom { height: 50%; background: var(--neon-blue); }
        .capsule.blue-tech .top { height: 50%; background: var(--primary-blue); }
        .capsule.blue-tech .bottom { height: 50%; background: var(--tech-blue); }
        .nano-chip { position: absolute; width: 8px; height: 8px; background: #FFE600; border: 1px solid #1E293B; top: 45%; left: 45%; transform: rotate(45deg); animation: pulse 2s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; box-shadow: 0 0 8px #FFE600; } }

        .product-info { flex: 1; }
        .badge { font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; color: white; display: inline-block; margin-bottom: 8px; text-transform: uppercase; }
        .badge.red { background: var(--medical-red); }
        .badge.blue { background: var(--neon-blue); }
        .product-title { font-size: 20px; font-weight: 700; color: var(--primary-blue); }
        .product-desc { color: #666; font-size: 13px; margin-bottom: 12px; }
        .tech-spec { font-size: 11px; color: var(--neon-blue); font-family: monospace; background: #F0F7FF; padding: 4px 8px; border-radius: 6px; }
        
        .purchase-options { display: flex; gap: 12px; margin-top: 15px; }
        .btn { border: none; padding: 10px 15px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; }
        .btn-once { background: #E5E5EA; color: var(--text-dark); }
        .btn-once:hover { background: #D1D1D6; }
        .btn-sub { background: var(--primary-blue); color: white; flex: 1; display: flex; justify-content: space-between; align-items: center; }
        .btn-sub:hover { background: #1E293B; }
        .sub-tag { background: var(--medical-red); font-size: 10px; padding: 2px 5px; border-radius: 4px; text-transform: uppercase; }

        /* Shopping Cart Sidebar */
        .cart-sidebar { background: white; border-radius: 16px; border: 1px solid #E5E5EA; padding: 20px; height: fit-content; position: sticky; top: 90px; }
        .cart-title { font-size: 16px; font-weight: 700; border-bottom: 2px solid var(--primary-blue); padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .cart-item { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #F4F6F8; }
        .type-tag { font-size: 10px; color: var(--medical-red); border: 1px solid var(--medical-red); padding: 1px 4px; border-radius: 3px; margin-left: 5px; }
        .cart-empty { text-align: center; color: #999; font-size: 12px; padding: 20px 0; }
        .total-price-box { margin-top: 15px; padding-top: 12px; border-top: 1px dashed #CBD5E1; display: flex; justify-content: space-between; font-weight: 700; }
        .checkout-btn { width: 100%; background: linear-gradient(135deg, var(--medical-red), #E0241B); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 12px; box-shadow: 0 4px 12px rgba(255, 59, 48, 0.2); }

        /* --- [PAGE 2: REMOTE CONTROL CENTER] --- */
        .control-panel { max-width: 800px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .panel-card { background: white; border-radius: 24px; border: 1px solid #E5E5EA; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); }
        .panel-title { font-size: 26px; font-weight: 800; color: var(--primary-blue); margin-bottom: 8px; }
        .panel-subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }

        /* Stage A: Start Stage */
        .start-screen { display: block; }
        .start-btn { background: linear-gradient(135deg, var(--neon-blue), var(--primary-blue)); color: white; border: none; padding: 18px 50px; font-size: 18px; font-weight: 700; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,122,255,0.3); transition: transform 0.2s; }
        .start-btn:hover { transform: scale(1.03); }

        /* Stage B: 5 Function Commands Selector */
        .buttons-screen { display: none; }
        .control-grid { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 530px; margin: 0 auto; }
        .control-opt-btn { background: #F8FAFC; border: 2px solid #E2E8F0; border-radius: 14px; padding: 18px 25px; font-size: 14px; font-weight: 700; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; color: var(--text-dark); }
        .control-opt-btn:hover { border-color: var(--neon-blue); background: #F0F7FF; }
        .control-opt-btn .btn-icon { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        
        .btn-r { border-left: 5px solid var(--medical-red); }.btn-r .btn-icon { background: rgba(255,59,48,0.1); color: var(--medical-red); }
        .btn-b { border-left: 5px solid var(--neon-blue); }.btn-b .btn-icon { background: rgba(0,122,255,0.1); color: var(--neon-blue); }

        /* Stage C: 30-Second Activation Countdown Screen */
        .active-screen { display: none; }
        .loading-circle { width: 140px; height: 140px; border-radius: 50%; border: 6px solid #E5E5EA; border-top-color: var(--medical-red); border-bottom-color: var(--neon-blue); margin: 30px auto; animation: spin 2s linear infinite; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: var(--primary-blue); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-pulse { color: var(--medical-red); font-weight: 700; font-size: 16px; animation: blink 1s infinite; margin-top: 15px; letter-spacing: 0.5px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Stage D: Success Confirmation Screen (5-Second Auto Returning) */
        .complete-screen { display: none; }
        .success-icon { width: 70px; height: 70px; background: #10B981; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 20px auto; }
        .auto-back-text { color: #8E8E93; font-size: 13px; margin-top: 25px; background: #F2F2F7; padding: 6px 12px; border-radius: 20px; display: inline-block; }

        footer { text-align: center; padding: 40px; color: #8E8E93; font-size: 12px; }
    </style>
</head>
<body>

    <!-- Global App Header Navigation -->
    <header>
        <div class="logo">🧬 NanoMed <span>Lab</span></div>
        <div class="nav-links">
            <button id="tab-shop" class="active" onclick="switchPage('shop')">🧬 Medical Store</button>
            <button id="tab-control" onclick="switchPage('control')">🎮 Remote Chip Control</button>
